services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUDIT_DB: /app/data/audit.db
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-https://portfolio-llm-gateway.onrender.com}
      GATEWAY_SESSION_TOKEN: ${GATEWAY_SESSION_TOKEN:-}
      GATEWAY_MODEL: ${GATEWAY_MODEL:-}
      GATEWAY_TIMEOUT: ${GATEWAY_TIMEOUT:-45}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    restart: unless-stopped

volumes:
  n8n_data:
