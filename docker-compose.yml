services:
  evaluation:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUDIT_DB: /app/data/evaluation.db
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SCHEMA: ${DB_SCHEMA:-harness}
      HUB_API_KEY: ${HUB_API_KEY:-}
      HARNESS_INGEST_TOKENS_JSON: ${HARNESS_INGEST_TOKENS_JSON:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
