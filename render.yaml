services:
  - type: web
    name: ai-engineering-evaluation-harness
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: harness
      - key: HUB_API_KEY
        sync: false
      - key: HARNESS_INGEST_TOKENS_JSON
        sync: false
