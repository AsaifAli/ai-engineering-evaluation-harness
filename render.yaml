services:
  - type: web
    name: ai-engineering-evaluation-harness
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: harness
      - key: LLM_PROVIDER
        value: deterministic
      - key: GATEWAY_BASE_URL
        value: https://portfolio-llm-gateway.onrender.com
      - key: GATEWAY_SESSION_TOKEN
        sync: false
      - key: GATEWAY_MODEL
        sync: false
      - key: HUB_API_KEY
        sync: false
      - key: MODEL_PROMOTION_MIN_SCORE
        value: "0.90"

      - key: COMMAND_CENTER_BASE_URL
        value: https://ai-automation-api.onrender.com
      - key: LEGACY_LENS_BASE_URL
        value: https://ai-code-modernization-api.onrender.com
      - key: EVIDENCEFLOW_BASE_URL
        value: https://evidenceflow-harness.onrender.com
      - key: QUOTESENSE_BASE_URL
        value: https://quotesense-harness.onrender.com
      - key: WEBQA_BASE_URL
        value: https://webqa-harness.onrender.com
